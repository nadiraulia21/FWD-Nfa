<div class="container mt-5">
    <div class="text-center mb-4">
        <h2><i class="bi bi-images"></i> Gallery</h2>
        <p class="text-muted">Foto Kegiatan</p>
    </div>

    <div class="row row-cols-2 row-cols-md-3 g-3">
        <div class="col">
            <div class="card">
                <img src="pic/ormik.jpg" class="gallery-img" alt="Image 1" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pic/mubes.jpg" class="gallery-img" alt="Image 2" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pic/biztrip.jpg" class="gallery-img" alt="Image 3" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pic/bizclub1.jpg" class="gallery-img" alt="Image 4" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pic/aljabar.jpg" class="gallery-img" alt="Image 5" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
        <div class="col">
            <div class="card">
                <img src="pic/padus.jpg" class="gallery-img" alt="Image 6" onerror="this.onerror=null; this.src='https://via.placeholder.com/300';">
            </div>
        </div>
    </div>
</div>

<style>
    .card {
        position: relative;
        overflow: hidden;
        padding-top: 100%;
        /* 1:1 Aspect Ratio (Square) */
    }
    
    .gallery-img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
    }
    
    .gallery-img:hover {
        transform: scale(1.1);
        opacity: 0.8;
    }
</style>
